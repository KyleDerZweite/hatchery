version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
      - area:backend
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Berlin
    labels:
      - dependencies
      - area:frontend
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    # TypeScript 7 broke CI because typescript-eslint does not support it yet
    # (see PR #51). Hold back TypeScript majors until the lint toolchain
    # catches up; remove this once typescript-eslint supports TS 7.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
